[control_center]
hidden_tabs = [ "media", "weather" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 1.0
border = "on_surface"
cross_axis_padding = 5
enabled = true
icon_size = 20
item_spacing = 3
launcher_custom_image_colorize = true
launcher_icon = "home-filled"
launcher_position = "start"
main_axis_padding = 5
show_dots = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 512.0
    cy = 586.0
    output = "Virtual-1"
    placement_height = 768.0
    placement_width = 1024.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0

[shell]
app_icon_colorize = true
external_ip_enabled = true
font_family = "JetBrainsMono Nerd Font"
lang = "pt-BR"
polkit_agent = false
settings_show_advanced = true

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Macchiato Lavender"
custom_palette = "stylix"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty", "niri" ]

[wallpaper]
fill_mode = "stretch"

    [wallpaper.default]
    path = "/nix/store/hf47w2xxai1bdas9f89hwrzlqk9nqyci-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/nix/store/hf47w2xxai1bdas9f89hwrzlqk9nqyci-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"
