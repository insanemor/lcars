# Configuração do noctalia — a sua, versionada.
#
# COMO ATUALIZAR ESTE ARQUIVO
#
#   1. Ajuste o que quiser no centro de controle do noctalia (SUPER+C)
#   2. Rode `nsave`
#
# O nsave (scripts/save.sh) exporta por cima deste arquivo, valida o TOML,
# mostra o diff, pergunta e publica. À mão seria:
#
#        noctalia config export merged > ~/.dotfiles/user/wm/noctalia-config.toml
#        cd ~/.dotfiles && git diff && git commit -am "…" && git push
#
# Sem esse passo, o que você ajustou vive só no state-dir desta máquina e some
# num clone novo — ou no próximo `nupdate`, que faz git reset --hard.
#
# O QUE NÃO ADIANTA MEXER AQUI
#
# Paleta, fonte, modo claro/escuro, papel de parede e as três opacidades são
# escritos pelo stylix, a partir de `lcars.system.theme`. Esses oito caminhos
# são *removidos* deste arquivo na leitura (a lista está em
# user/wm/noctalia.nix) — por isso o `export merged` acima pode despejar a
# configuração inteira sem colidir com o stylix, mas também por isso mudar cor
# ou fonte pela GUI não gruda. Para trocar cor, troque
# `lcars.system.theme.scheme`; para trocar a fonte, `lcars.system.theme.fonts`.
#
# O arquivo começa quase vazio, e continua pequeno depois do primeiro export:
# `merged` exporta a SUA configuração, não os defaults embutidos do noctalia
# (esse é o `full`). O diff mostra o que você mudou.

[shell]
# Mostra as opções avançadas no painel de configuração — sem isso, boa parte
# do que dá para ajustar fica escondida.
settings_show_advanced = true

# O agente polkit já vem do Hyprland (system/wm/hyprland.nix). Dois agentes
# disputando o mesmo serviço é conflito, não redundância.
polkit_agent = false
